<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged out · BTS Dress Notes</title>
    <link rel="stylesheet" href="/base.css">
    <style>
        .logged-out { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 24px; text-align: center; }
        .logged-out .brand { color: var(--text-3); margin-bottom: 16px; }
        .logged-out h1 { font-size: 18px; font-weight: 600; }
        .logged-out .btn { margin-top: 20px; text-decoration: none; }
    </style>
</head>
<body>
    <main class="logged-out">
        <div class="brand">Dress Notes</div>
        <h1 class="empty-title">You&rsquo;re logged out</h1>
        <p class="muted">You can close this tab, or log in again to keep going.</p>
        <a class="btn primary" href="{{loginUrl}}">Log in again</a>
    </main>
</body>
</html>
