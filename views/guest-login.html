<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who are you? · BTS Dress Notes</title>
    <link rel="stylesheet" href="/base.css">
    <style>
        .guest { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 24px; text-align: center; }
        .guest .brand { color: var(--text-3); margin-bottom: 16px; }
        .guest h1 { font-size: 18px; font-weight: 600; }
        .guest form { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; width: min(320px, 100%); }
    </style>
</head>
<body>
    <main class="guest">
        <div class="brand">Dress Notes</div>
        <h1 class="empty-title">Who are you?</h1>
        <p class="muted">Your name goes on the notes you write.</p>
        <form method="post" action="/login">
            <input type="hidden" name="returnTo" value="{{returnTo}}">
            <input type="text" name="name" maxlength="60" required autofocus autocomplete="name" aria-label="Your name" placeholder="Your name">
            <button class="btn primary" type="submit">Continue</button>
        </form>
    </main>
</body>
</html>
