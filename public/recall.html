<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past notes · BTS Dress Notes</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="index-style.css">
    <link rel="stylesheet" href="recall-style.css">
    <script src="recall-boot.js"></script>
</head>
<body>
    <header class="topbar">
        <a href="/" class="btn ghost back">&larr; Notes</a>
        <div class="brand">Past notes<span id="showName" class="show-name" hidden></span></div>
        <div class="topbar-actions">
            <a id="playbackLink" href="/playback.html" class="btn ghost video-link" aria-label="Open video" title="Open video" hidden><svg class="icon" aria-hidden="true"><use href="icons.svg#i-video"/></svg><span>Video</span></a>
            <a href="/recall.html" id="openAnother" class="btn ghost" hidden>Open another</a>
        </div>
    </header>

    <main class="page">
        <input type="file" id="fileInput" accept=".json,application/json" hidden>
        <p id="fileError" class="field-error" role="alert" hidden></p>

        <div id="showLoading" class="notes loading-region is-loading" aria-busy="true">
            <div class="toolbar skeleton" data-loading-placeholder aria-hidden="true"><span class="bone search-bone"></span></div>
            <div id="showLoadingList" class="notes-list skeleton" data-loading-placeholder aria-hidden="true">
                <div class="group-head"><span class="bone head-bone"></span></div>
                <div class="note">
                    <span class="bone avatar-bone"></span>
                    <div class="note-main">
                        <div class="note-head"><span class="bone meta-bone"></span></div>
                        <span class="bone line w-80"></span>
                        <span class="bone line w-45"></span>
                        <div class="note-foot"><span class="bone chip-bone"></span></div>
                    </div>
                </div>
                <div class="note">
                    <span class="bone avatar-bone"></span>
                    <div class="note-main">
                        <div class="note-head"><span class="bone meta-bone"></span></div>
                        <span class="bone line w-60"></span>
                        <div class="note-foot"><span class="bone chip-bone"></span></div>
                    </div>
                </div>
                <div class="note">
                    <span class="bone avatar-bone"></span>
                    <div class="note-main">
                        <div class="note-head"><span class="bone meta-bone"></span></div>
                        <span class="bone line w-90"></span>
                        <span class="bone line w-30"></span>
                        <div class="note-foot"><span class="bone chip-bone"></span></div>
                    </div>
                </div>
                <div class="note">
                    <span class="bone avatar-bone"></span>
                    <div class="note-main">
                        <div class="note-head"><span class="bone meta-bone"></span></div>
                        <span class="bone line w-50"></span>
                        <div class="note-foot"><span class="bone chip-bone"></span></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="dropZone" class="empty drop-zone">
            <p class="empty-title">Open a notes file</p>
            <p class="muted">Choose a <strong>.json</strong> notes file from your device, or drop it here.</p>
            <button type="button" id="chooseFile" class="btn primary">Choose file</button>
        </div>

        <section id="savedShows" class="saved-shows" aria-labelledby="savedShowsTitle" hidden>
            <h2 id="savedShowsTitle" class="saved-shows-title">Saved shows</h2>
            <div id="savedShowsList" class="saved-shows-list"></div>
        </section>

        <section id="notesSection" class="notes" aria-label="Notes" hidden>
            <div class="toolbar">
                <label class="search">
                    <svg class="icon"><use href="icons.svg#i-search"/></svg>
                    <input type="search" id="searchInput" placeholder="Search notes, people, cues" aria-label="Search notes">
                </label>
                <button type="button" id="actFilter" class="select" aria-haspopup="listbox" aria-expanded="false" title="Filter by scene"></button>
                <button type="button" id="tagFilter" class="select" aria-haspopup="listbox" aria-expanded="false" title="Filter by tag"></button>
                <button type="button" id="clearFilters" class="btn outline clear-filters" title="Show all notes again" hidden><svg class="icon" aria-hidden="true"><use href="icons.svg#i-close"/></svg>Clear filters</button>
                <div class="toolbar-end">
                    <span id="notesCount" class="muted"></span>
                </div>
            </div>
            <div id="notesList" class="notes-list"></div>
            <div id="notesNoMatch" class="empty" hidden>
                <p class="empty-title">No notes match these filters</p>
                <button type="button" class="btn outline" data-action="clear-filters"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-close"/></svg>Clear filters</button>
            </div>
        </section>
    </main>

    <div id="actFilterPopover" class="popover filter-popover" role="listbox" aria-label="Filter by scene" hidden></div>
    <div id="tagFilterPopover" class="popover filter-popover" role="listbox" aria-label="Filter by tag" hidden></div>

    <script src="keepalive.js"></script>
    <script src="note-order.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="safe-html.js"></script>
    <script src="timecode-format.js"></script>
    <script src="note-view.js"></script>
    <script src="loading-state.js"></script>
    <script src="playback-context.js"></script>
    <script src="recall.js"></script>
</body>
</html>
