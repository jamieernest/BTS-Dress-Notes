<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene overlay · BTS Dress Notes</title>
    <link rel="stylesheet" href="overlay-style.css">
</head>
<body>
    <div class="overlay-container" id="overlayContainer">
        <div class="realtime-display">
            <div class="label">Real time</div>
            <div class="realtime-value" id="realtimeValue">00:00:00.00</div>
        </div>
        <div class="act-display">
            <div class="label">Scene</div>
            <div class="act-value" id="actValue">--</div>
        </div>
        <div class="connection-status disconnected" id="connectionStatus">Disconnected</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="keepalive.js"></script>
    <script src="timecode-format.js"></script>
    <script src="overlay-cast.js"></script>
</body>
</html>
